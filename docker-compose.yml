name: dt-ems

services:
  db:
    image: postgres:18.6-alpine
    container_name: ems-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ems}
      POSTGRES_USER: ${POSTGRES_USER:-ems}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ems_local_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      # Executed only on first initialisation of an empty volume.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ems} -d ${POSTGRES_DB:-ems}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ems-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-ems}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-ems}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-ems_local_dev_password}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: ems-web
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      # NEXT_PUBLIC_* values are inlined at build time, see web/Dockerfile.
      NEXT_PUBLIC_API_BASE_URL: http://localhost:${BACKEND_PORT:-8080}/api
      PORT: 3000
      HOSTNAME: 0.0.0.0
    ports:
      - "${WEB_PORT:-3000}:3000"

volumes:
  db_data: