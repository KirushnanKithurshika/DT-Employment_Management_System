name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancels superseded runs on the same branch to save runner minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Java 21 / Spring Boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify
        run: ./mvnw -B -ntp verify

      - name: Build image
        run: docker build -t ems-backend:ci .

  web:
    name: Web (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # NOTE: npm caching is intentionally not enabled yet. setup-node fails
      # when its cache-dependency-path cannot be resolved, and web/package-lock.json
      # is not committed yet. Re-enable `cache: npm` together with the lockfile.
      - name: Install
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Build image
        run: docker build -t ems-web:ci .

  mobile:
    name: Mobile (Flutter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: stable
          channel: stable
          # Caching stays off until mobile/pubspec.lock is committed, since the
          # cache key is derived from that file.

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  infra:
    name: Infrastructure (Compose)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose file
        run: docker compose config --quiet

      - name: Verify env template exists
        run: test -f .env.example

  # The root setup must never be committed without its database schema,
  # otherwise a fresh `docker compose up` starts against an empty database.
  schema-present:
    name: Schema present
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: db/init contains at least one .sql file
        run: test -n "$(find db/init -name '*.sql' -print -quit)"